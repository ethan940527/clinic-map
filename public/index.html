<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개원 입지 지도</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="mapwrap">
  <div id="map"></div>
  <form class="search" id="search" role="search">
    <input id="q" type="search" placeholder="지역·역 이름으로 이동 (예: 강남역)" autocomplete="off" enterkeyhint="search">
    <button type="submit" aria-label="검색">이동</button>
  </form>
  <div class="legend"><span class="lg act"></span>영업 중 <span class="lg new"></span>새로 개원 <button class="clsToggle" id="clsToggle" aria-pressed="false"><span class="lg cls"></span>폐업 위치</button></div>
  <p class="zoomhint" id="zoomhint" hidden>지도를 확대하면 병원 위치가 보여요</p>
</div>

<section class="panel" id="panel">
  <div class="grab" aria-hidden="true"></div>
  <p class="stamp" id="stamp">데이터를 불러오는 중…</p>

  <div class="row">
    <h1 id="title">지금 보고 있는 지역</h1>
    <div class="pills" role="tablist" aria-label="기간">
      <button data-yr="1" aria-pressed="true">최근 1년</button>
      <button data-yr="3" aria-pressed="false">3년</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="sum" id="sum"></div>
  <p class="verdict" id="verdict"></p>

  <ol class="depts" id="depts"></ol>
  <p class="note">행정안전부 지방행정 인허가 데이터 기준이에요. 진료과는 간판(병원 이름)에 쓰인 과로 나눴고, 이름에 과가 없고 여러 과를 함께 보는 곳은 '일반의원'으로 묶었어요. 치과·한의원은 제외했어요.</p>
</section>


<script src="app.js"></script>
</body>
</html>
